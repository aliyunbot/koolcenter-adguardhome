# Schema-34 candidate for the external AdGuard Home binary.
# Not applied to a live router and not validated by executing the ARM binary here.
# Portable core owns reconciliation. The KoolCenter adapter must verify SmartDNS
# ownership of 127.0.0.1:7913 before allowing this configuration to pass.
# AGH never binds port 53 in this project.
schema_version: 34
http:
  address: 127.0.0.1:3000
  session_ttl: 3h
users: []
dns:
  bind_hosts:
    - 127.0.0.1
  port: 6053
  upstream_dns:
    - 127.0.0.1:7913
  bootstrap_dns: []
  fallback_dns: []
  cache_enabled: true
  cache_size: 4194304
filtering:
  filtering_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
filters: []
clients:
  persistent: []
  runtime_sources:
    whois: false
    arp: false
    rdns: false
    dhcp: false
    hosts: true
dhcp:
  enabled: false
tls:
  enabled: false
querylog:
  enabled: true
  file_enabled: true
  interval: 30d
  size_memory: 1000
statistics:
  enabled: true
  interval: 10d
os:
  group: ''
  user: ''
log:
  file: ''
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: true
  local_time: false
  verbose: false
